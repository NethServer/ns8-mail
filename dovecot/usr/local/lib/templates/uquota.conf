#
# User quota configuration
#
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}

protocol !indexer-worker {
  mail_vsize_bg_after_count = 100
}

quota Quota {
  driver = count
}
# Default limit for all users. 0 means unlimited.
quota_storage_size = ${quota_rule_storage}M
# The last message can exceed the limit by 10%, as in Dovecot 2.3
quota_storage_grace = ${quota_storage_grace_kb}k

# Per-user custom quota: uquota.lua reads the uquota dict files and
# returns the quota_storage_size and quota_storage_grace userdb fields
userdb uquota {
  driver = lua
  lua_file = /etc/dovecot/uquota.lua
  result_success = continue
  result_failure = continue
  skip = never
}
