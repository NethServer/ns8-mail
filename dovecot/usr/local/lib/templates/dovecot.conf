#
# NS8 Dovecot 2.4 configuration -- generated by reload-config, do not edit.
# Custom settings go in local.conf.d/*.conf (Dovecot 2.4 syntax).
#
dovecot_config_version = 2.4.5
# Oldest Dovecot version that must read the mail storage and indexes.
# Going back to Dovecot 2.3 is not supported: use the 2.4.5 formats.
# Up to 2.4.5 only the IMAP THREAD index changes, and Dovecot rebuilds
# it when a mailbox is next threaded.
dovecot_storage_version = 2.4.5

protocols = imap pop3 lmtp sieve
login_trusted_networks = ${login_trusted_networks}
mail_shared_explicit_inbox = yes

#
# limits
#

# Default virtual memory size limit for service processes:
default_vsz_limit = 1024M

# User connections default limit:
mail_max_userip_connections = ${tmpl_mail_max_userip_connections}

# Default process number and connection limit for dovecot services:
default_process_limit = ${tmpl_default_process_limit}
default_client_limit = ${tmpl_default_client_limit}

#
# 10-auth
#
# Clear-text authentication without TLS is allowed only from secured
# connections: localhost and login_trusted_networks, as with "ssl = yes"
# Dovecot considers them secured, like Dovecot 2.3 did
auth_allow_cleartext = no
auth_mechanisms = plain login

#
# 10-logging
#
log_path = syslog

#
# 10-mail
#
mail_driver = maildir
mail_path = ~/Maildir
mail_home = /var/lib/vmail/%{user | username | lower}
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 100
last_valid_uid = 100
first_valid_gid = 101
last_valid_gid = 101
# Read and write mailbox names escaped by the 2.3 listescape plugin
mailbox_list_storage_escape_char = "\\"
# Keep listing \NoSelect mailboxes, as Dovecot 2.3 did
mailbox_list_drop_noselect = no

mail_plugins {
${tmpl_mail_plugins}
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox "Sent Messages" {
    special_use = \Sent
  }
  mailbox "${tmpl_spam_folder}" {
    special_use = \Junk
    auto = ${tmpl_spam_folder_auto}
  }
  mailbox "${tmpl_trash_folder}" {
    special_use = \Trash
    auto = subscribe
  }
}
namespace SHARED_USERS {
  type = shared
  separator = /
  prefix = Shared/${S}user/
  mail_driver = maildir
  mail_path = /var/lib/vmail/%{owner_user | username}/Maildir
${tmpl_sharedseen}
  subscriptions = no
  list = children
}
namespace PUBLIC {
  type = public
  separator = /
  prefix = Public/
  mail_driver = maildir
  mail_path = /var/lib/vmail/vmail/Maildir
  mail_index_private_path = ~/Maildir/public
  subscriptions = no
  list = children
}

#
# IMAP events log
#
mail_log_events {
  delete = yes
  undelete = yes
  expunge = yes
  copy = yes
  mailbox_delete = yes
  mailbox_rename = yes
  mailbox_create = yes
  flag_change = yes
  append = yes
}
mail_log_fields {
  uid = yes
  box = yes
  msgid = yes
  from = yes
  subject = yes
  flags = yes
}

#
# 10-ssl
#
ssl = yes
ssl_server_cert_file = /etc/ssl/dovecot/server.pem
ssl_server_key_file = /etc/ssl/dovecot/server.key
ssl_server_dh_file = /etc/ssl/dovecot/dh.pem
ssl_server_prefer_ciphers = server

#
# 10-master
#
service auth {
  unix_listener /var/lib/umail/auth {
    mode = 0660
    group = vmail
  }
  unix_listener auth-userdb {
    group = vmail
    mode = 0660
  }
  inet_listener auth {
    port = 4367
  }
}

#
# 20-lmtp
#
lmtp_save_to_detail_mailbox = yes
service lmtp {
  unix_listener /var/lib/umail/lmtp {
    mode = 0660
    user = vmail
    group = vmail
  }
}

#
# doveadm http API server
#
doveadm_api_key = ${doveadm_api_key}
service doveadm {
  inet_listener http {
    port = ${doveadm_api_port}
  }
}

#
# Named dicts, for "doveadm dict" and the doveadm HTTP API "filterName"
# parameter. Each block holds exactly one dict.
#
# Per-user custom spam retention days:
dict_server {
  dict uspamret {
    driver = file
    dict_file_path = /var/lib/dovecot/dict/uspamret.db
  }
}
# Per-user custom quota MB, read by uquota.lua. The quota_clone plugin
# is not loaded: this block only names the dict.
quota_clone {
  dict uquota {
    driver = fs
    fs posix {
      fs_posix_prefix = /var/lib/dovecot/dict/uquota/
    }
  }
}

#
# HTTP server for OpenMetrics exporter
#
service stats {
  inet_listener http {
    port = ${stats_http_port}
  }
}
!include stats.conf

#
# 90-sieve
#
sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}
sieve_script spam_actions {
  type = before
  path = /etc/dovecot/spam-actions.sieve
}
sieve_plugins {
  sieve_extprograms = yes
  sieve_imapsieve = yes
}
sieve_global_extensions {
  vnd.dovecot.pipe = yes
  vnd.dovecot.environment = yes
  editheader = yes
}
sieve_editheader_max_header_size = 2048
sieve_environment {
  spam_subject_prefix = ${tmpl_spam_subject_prefix}
  spam_folder = ${tmpl_spam_folder}
  spam_folder_auto = ${tmpl_spam_folder_auto}
}
sieve_pipe_bin_dir = /usr/local/lib/dovecot/sieve-pipe

# From elsewhere to Spam folder
mailbox "${tmpl_spam_folder}" {
  sieve_script report_spam {
    type = before
    cause = copy
    path = /etc/dovecot/report-spam.sieve
  }
}
# From Spam folder to elsewhere
imapsieve_from "${tmpl_spam_folder}" {
  sieve_script report_ham {
    type = before
    cause = copy
    path = /etc/dovecot/report-ham.sieve
  }
}
service managesieve-login {
  inet_listener sieve_deprecated {
    port = 2000 # still used by WebTop?
  }
}
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

#
# 90-acls
#
protocol imap {
  mail_plugins {
    imap_acl = yes
    imap_sieve = yes
    imap_filter_sieve = yes
  }
}

acl_driver = vfile
acl_sharing_map {
  dict file {
    path = /var/lib/vmail/shared-mailboxes.db
  }
}

#
# FTS (Full Text Search)
#
fts flatcurve {
  substring_search = ${flatcurve_substring_search}
}
fts_autoindex = yes
language_tokenizers = generic email-address
language_filters = lowercase normalizer-icu stopwords
# Dovecot is built without language detection (libexttextcat), so only
# the default language is ever used. With Dovecot 2.3 that was the first
# item of fts_languages: "da". Keep it, so search terms are processed
# like the terms of the existing FTS indexes.
language da {
  default = yes
}
fts_decoder_driver = script
fts_decoder_script_socket_path = decode2text
service decode2text {
  executable = script /usr/local/libexec/dovecot/decode2text.sh
  user = vmail
  unix_listener decode2text {
    mode = 0666
  }
}

#
# 90-postlogin
#
service imap {
  executable = imap imap-postlogin
}

service imap-postlogin {
  executable = script-login /usr/local/bin/dovecot-postlogin
  user = ${S}SET:default_internal_user
  unix_listener imap-postlogin {
  }
}

#
# Master users DB, Authentication + Users LDAP backend
#
auth_master_user_separator = *
auth_username_format = %{user | username | lower}
passdb users {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/users
  master = yes
}
userdb users {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/users
}
# Default quota storage is ${quota_rule_storage}M
# an auxiliary userdb with custom quota values can
# be included in the following line if greater than 0:
${condinclude_local_quota}
userdb prefetch {
  # Read user from passdb
  driver = prefetch
}
# LDAP passdb and userdb:
!include ldap.conf
# end of pass/user db configuration

# Include settings for trusted networks. Dovecot 2.4 wants filters like
# "remote" after the global settings they override:
!include_try trusted_networks.conf

# Include local.conf.d/ contents:
!include_try local.conf.d/*.conf
