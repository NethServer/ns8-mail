#
# RFC2307 (OpenLDAP) configuration for passdb and userdb
#

ldap_uris = ldap://${ldap_host}:${ldap_port}

# LDAP bind credentials
ldap_auth_dn = ${ldap_bind_dn}
ldap_auth_dn_password = ${ldap_bind_password}

ldap_base = ${ldap_base_dn}

# LDAP master users: only the users listed in DOVECOT_MASTER_USERS, or
# no user ("!*") if the list is empty
passdb ldap_master {
  driver = ldap
  master = yes
  username_filter = ${master_users}
  auth_verbose = yes
  # Use authentication binding for verifying password's validity.
  ldap_bind = yes
  ldap_filter = (&(uid=%{user | username | lower})(objectClass=inetOrgPerson)${ldap_users_search_filter_clause})
  fields {
    user = %{ldap:uid | lower}
  }
}

passdb ldap {
  username_filter = !vmail
  auth_verbose = yes
  # Use authentication binding for verifying password's validity.
  bind = yes
  # Filter for password lookups (passdb lookup)
  filter = (&(uid=%{user | username | lower})(objectClass=inetOrgPerson)${ldap_users_search_filter_clause})
  fields {
    user = %{ldap:uid | lower}
  }
}

userdb ldap {
  filter = (&(objectClass=inetOrgPerson)(uid=%{user | username | lower})${ldap_users_search_filter_clause})
  fields {
    user = %{ldap:uid | lower}
  }
  # Attributes to get the list of all users
  iterate_filter = (&(objectClass=inetOrgPerson)${ldap_users_search_filter_clause})
  iterate_fields {
    user = %{ldap:uid | lower}
  }
}
